global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "rpi-node"
    static_configs:
      - targets: ["172.17.0.1:9100"]

  - job_name: "fluent-bit"
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]
